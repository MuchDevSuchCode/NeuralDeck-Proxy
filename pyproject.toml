[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraldeck-proxy"
version = "1.0.0"
description = "Local LLM dashboard, prompt lab, benchmarks and multimodal proxy for llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.26"]

[project.scripts]
neuraldeck = "neuraldeck.cli:main"

[tool.setuptools]
packages = ["neuraldeck"]

[tool.setuptools.package-data]
neuraldeck = ["static/*"]
